<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/scripts/csrf.js" defer></script>
  <script src="/static/scripts/error-modal.js" defer></script>
</head>

<body>

<div class="login-layout">

  <aside class="login-brand" aria-label="Información de la organización">
    <div class="brand-decor brand-decor-1"></div>
    <div class="brand-decor brand-decor-2"></div>

    <div class="brand-content">
      <div class="brand-icon" aria-hidden="true">
        <i data-lucide="users"></i>
      </div>
      <h1>Mi Organización</h1>
      <p class="brand-subtitle">Gestión de Afiliados</p>
      <p>Administrá afiliados, empresas y usuarios desde un único sistema.</p>
    </div>
  </aside>

  <main class="login-main">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Bienvenido</h2>
        <p>Ingresá tus credenciales para continuar</p>
      </div>

      <form class="login-form" id="login-form" action="/login" method="post" onsubmit="handleSubmit(event)">
        <input type="hidden" name="csrf" value="">
        <div class="form-group">
          <label for="user">Usuario</label>
          <div class="input-row{{with .Errors.user}} input-invalid{{end}}">
            <span class="field-icon" aria-hidden="true">
              <i data-lucide="user"></i>
            </span>
            <input
              type="text"
              id="user"
              name="user"
              placeholder="Ingresá tu usuario"
              autocomplete="username"
              value="{{.Username}}"
              required
            >
          </div>
          {{with .Errors.user}}<p class="field-error" role="alert">{{.}}</p>{{end}}
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-row{{with .Errors.password}} input-invalid{{end}}">
            <span class="field-icon" aria-hidden="true">
              <i data-lucide="lock"></i>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresá tu contraseña"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="toggle-visibility"
              aria-label="Mostrar contraseña"
              onclick="togglePassword(this)"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
          {{with .Errors.password}}<p class="field-error" role="alert">{{.}}</p>{{end}}
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Recordarme</span>
          </label>
          <a href="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Ingresar</button>
      </form>
    </div>

    <p class="login-footer">Versión 1.0.0 · © Mi Organización</p>
  </main>

</div>

<script>
  lucide.createIcons();

  var REMEMBER_KEY = 'remembered_username';

  function restoreRememberedUser() {
    var userInput = document.getElementById('user');
    var remember = document.getElementById('remember');
    if (!userInput || !remember) return;
    if (userInput.value.trim()) return;
    var saved = localStorage.getItem(REMEMBER_KEY);
    if (!saved) return;
    userInput.value = saved;
    remember.checked = true;
  }

  function persistRememberedUser() {
    var userInput = document.getElementById('user');
    var remember = document.getElementById('remember');
    if (!userInput || !remember) return;
    var username = userInput.value.trim();
    if (remember.checked && username) {
      localStorage.setItem(REMEMBER_KEY, username);
    } else {
      localStorage.removeItem(REMEMBER_KEY);
    }
  }

  restoreRememberedUser();

  function togglePassword(btn) {
    const input = document.getElementById('password');
    const icon = btn.querySelector('i');
    const isHidden = input.type === 'password';

    input.type = isHidden ? 'text' : 'password';
    icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
    lucide.createIcons();
  }

  function handleSubmit(e) {
    const isFilePreview = window.location.protocol === 'file:';
    if (!isFilePreview) {
      persistRememberedUser();
      return;
    }

    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.textContent = 'Ingresando...';
    btn.disabled = true;

    setTimeout(function () {
      window.location.href = '../dashboard/dashboard.html';
    }, 700);
  }
</script>

</body>
</html>
