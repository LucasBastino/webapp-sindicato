<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cambiar contraseña</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="modal-page modal-change-password">

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-inner">
      <div class="modal-header">
        <div class="header-left">
          <div class="header-icon" aria-hidden="true">
            <i data-lucide="key-round"></i>
          </div>
          <div class="header-text">
            <h3 id="modal-title">Cambiar contraseña</h3>
            <p>Completá los campos para cambiar la contraseña del usuario.</p>
          </div>
        </div>

        <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form class="form" id="change-password-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="current-password">Contraseña actual</label>
          <div class="input-row">
            <input id="current-password" name="current-password" type="password" placeholder="Ingresá tu contraseña actual" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña actual" onclick="togglePassword('current-password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="new-password">Nueva contraseña</label>
          <div class="input-row">
            <input id="new-password" name="new-password" type="password" placeholder="Ingresá la nueva contraseña" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar nueva contraseña" onclick="togglePassword('new-password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar nueva contraseña</label>
          <div class="input-row">
            <input id="confirm-password" name="confirm-password" type="password" placeholder="Repetí la nueva contraseña" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar confirmación de contraseña" onclick="togglePassword('confirm-password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" type="submit" form="change-password-form" id="btn-submit">Guardar cambios</button>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  function closeModal() {
    window.history.back();
  }

  function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.textContent = 'Guardando...';
    btn.disabled = true;

    setTimeout(function () {
      alert('Contraseña actualizada correctamente');
      closeModal();
    }, 700);
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    const isHidden = input.type === 'password';

    input.type = isHidden ? 'text' : 'password';
    icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
    lucide.createIcons();
  }

  document.getElementById('modal-overlay').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
