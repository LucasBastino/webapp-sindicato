<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrar usuario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body>

<div class="layout">

  {{template "sidebar" .PageContext}}

  <main class="content" id="main-content">
    {{template "register-content" .}}
  </main>

</div>
</body>
</html>

{{define "register-content"}}

    <div class="page-header">
      <h1>Registrar usuario</h1>
      <p>Completá la información para crear un nuevo usuario del sistema.</p>
    </div>

    <div class="card register-card">
      <div class="card-form-header">
        <div class="card-form-icon" aria-hidden="true">
          <i data-lucide="user-plus"></i>
        </div>
        <div>
          <h3>Nuevo usuario</h3>
          <p>Datos personales y acceso</p>
        </div>
      </div>

      <form class="register-form" id="register-form" action="/users" method="post" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="username">Nombre de usuario <span class="required">*</span></label>
          <div class="input-row">
            <span class="field-icon" aria-hidden="true"><i data-lucide="user"></i></span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Ingresar nombre de usuario"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="role">Rol <span class="required">*</span></label>
          <div class="input-row">
            <span class="field-icon" aria-hidden="true"><i data-lucide="shield"></i></span>
            <select id="role" name="role" required>
              <option value="" disabled selected>Seleccionar rol</option>
              <option value="admin">Administrador</option>
              <option value="operator">Operador</option>
              <option value="supervisor">Supervisor</option>
              <option value="readonly">Solo lectura</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña <span class="required">*</span></label>
          <div class="input-row">
            <span class="field-icon" aria-hidden="true"><i data-lucide="lock"></i></span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresar contraseña"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-visibility" aria-label="Mostrar contraseña" onclick="togglePassword('password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirmar contraseña <span class="required">*</span></label>
          <div class="input-row">
            <span class="field-icon" aria-hidden="true"><i data-lucide="lock"></i></span>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Repetir contraseña"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-visibility" aria-label="Mostrar confirmación" onclick="togglePassword('confirm_password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
      </form>

      <div class="form-footer">
        <button type="button" class="btn-cancel" onclick="goBack()">Cancelar</button>
        <button type="submit" class="btn-create" form="register-form" id="btn-create">
          <i data-lucide="user-plus"></i>
          Crear usuario
        </button>
      </div>
    </div>

<script>
  lucide.createIcons();

  function togglePassword(inputId, btn) {
    var input = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    var isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
    lucide.createIcons();
  }

  function goBack() {
    window.location.href = '/user_panel';
  }

  function handleSubmit(e) {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm_password').value;

    if (password !== confirm) {
      e.preventDefault();
      alert('Las contraseñas no coinciden.');
      return;
    }

    if (window.location.protocol === 'file:') {
      e.preventDefault();
      var btn = document.getElementById('btn-create');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader"></i> Creando...';
      lucide.createIcons();
      setTimeout(function() {
        alert('Usuario creado correctamente (vista previa)');
        window.location.href = '/user_panel';
      }, 700);
    }
  }

  var dropdown = document.getElementById('profile-dropdown');
  var menu = document.getElementById('dropdown-menu');
  if (dropdown && menu) {
    dropdown.querySelector('.profile-trigger').addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.toggle('show');
    });
    document.addEventListener('click', function() {
      menu.classList.remove('show');
    });
  }
</script>

{{end}}
